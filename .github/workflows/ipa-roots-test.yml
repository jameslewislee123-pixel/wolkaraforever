name: Tolkara External JIT Diagnostics IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout diagnostics-enabled main source
        uses: actions/checkout@v5
        with:
          repository: jklock/wolkaraforever
          ref: 438bf348ddd13ae7a10cc0ea50ccd1b0751e03b6
          persist-credentials: false

      - name: Verify exact source and diagnostic implementation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "438bf348ddd13ae7a10cc0ea50ccd1b0751e03b6"
          test -f wolkaraforever/patches/0061-external-jit-requires-its-enabler.patch
          test -f wolkaraforever/Shell/ExternalJITDiagnostics.m
          test -f wolkaraforever/tools/classify_external_jit.py
          echo "Source SHA: $(git rev-parse HEAD)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build certificate-enabled External JIT IPA
        run: |
          TOLKARA_SYSTEM_ROOTS=YES \
            wolkaraforever/tools/package_ipa.sh \
            Tolkara-diagnostics-438bf348.ipa

      - name: Upload IPA and source details
        uses: actions/upload-artifact@v4
        with:
          name: Tolkara-diagnostics-438bf348
          path: build/platform/Tolkara-diagnostics-438bf348.ipa
          if-no-files-found: error
