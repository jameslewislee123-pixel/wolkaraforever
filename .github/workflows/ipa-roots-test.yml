name: Tolkara External JIT Memory Diagnostics IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout diagnostics-enabled main source
        uses: actions/checkout@v5
        with:
          repository: jklock/wolkaraforever
          ref: 9df025e4f27e8cbef00e355690641d1bfb22b752
          persist-credentials: false

      - name: Verify exact source and diagnostic implementation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "9df025e4f27e8cbef00e355690641d1bfb22b752"
          test -f wolkaraforever/patches/0061-external-jit-requires-its-enabler.patch
          test -f wolkaraforever/Shell/ExternalJITDiagnostics.m
          grep -q 'memory checkpoint=' wolkaraforever/Shell/ExternalJITDiagnostics.m
          test -f wolkaraforever/tools/classify_external_jit.py
          echo "Source SHA: $(git rev-parse HEAD)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build certificate-enabled External JIT IPA
        run: |
          TOLKARA_SYSTEM_ROOTS=YES \
            wolkaraforever/tools/package_ipa.sh \
            Tolkara-diagnostics-9df025e4.ipa

      - name: Upload IPA and source details
        uses: actions/upload-artifact@v4
        with:
          name: Tolkara-diagnostics-9df025e4
          path: build/platform/Tolkara-diagnostics-9df025e4.ipa
          if-no-files-found: error
